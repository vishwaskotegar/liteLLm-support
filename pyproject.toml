[project]
name = "litellm-support"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.6",
    "langsmith>=0.14.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
